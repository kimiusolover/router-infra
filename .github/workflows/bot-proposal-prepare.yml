name: reusable bot proposal preparation

on:
  workflow_call:
    inputs:
      test-command: {required: true, type: string}
      allowed-change-paths: {required: true, type: string}
      protected-paths: {required: false, default: '', type: string}
      proposal-title: {required: true, type: string}
      proposal-body: {required: true, type: string}

permissions:
  contents: read

jobs:
  prepare:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with: {fetch-depth: 0}
      - id: infra
        name: Resolve pinned infrastructure revision
        env:
          WORKFLOW_REF: ${{ github.workflow_ref }}
        run: |
          case "$WORKFLOW_REF" in */.github/workflows/*@?*) ;; *) exit 1 ;; esac
          INFRA_REF="${WORKFLOW_REF##*@}"
          case "$INFRA_REF" in *[!0-9a-f]*) exit 1 ;; esac
          test "${#INFRA_REF}" -eq 40
          echo "repository=${WORKFLOW_REF%%/.github/workflows/*}" >> "$GITHUB_OUTPUT"
          echo "ref=$INFRA_REF" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: ${{ steps.infra.outputs.repository }}
          ref: ${{ steps.infra.outputs.ref }}
          path: .router-infra
      - name: Run repository checks and prepare proposal
        env:
          TEST_COMMAND: ${{ inputs.test-command }}
        run: bash -o errexit -o nounset -o pipefail -c "$TEST_COMMAND"
      - name: Preserve policy tools outside the proposal tree
        run: |
          cp .router-infra/policy/verify_bot_change.py "$RUNNER_TEMP/verify_bot_change.py"
          cp .router-infra/policy/bot_proposal.py "$RUNNER_TEMP/bot_proposal.py"
          rm -rf -- .router-infra
      - name: Stage generated proposal
        run: git add -A
      - id: eligibility
        name: Enforce proposal boundary
        env:
          ALLOWED_CHANGE_PATHS: ${{ inputs.allowed-change-paths }}
          PROTECTED_PATHS: ${{ inputs.protected-paths }}
        run: |
          set +e
          python3 "$RUNNER_TEMP/verify_bot_change.py" --allowed-change-paths "$ALLOWED_CHANGE_PATHS" --protected-paths "$PROTECTED_PATHS"
          status=$?
          if test "$status" -eq 3; then
            echo "outcome=needs-human-review" >> "$GITHUB_OUTPUT"
            echo "## needs-human-review" >> "$GITHUB_STEP_SUMMARY"
            echo "No artifact was published." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          test "$status" -eq 0
          echo "outcome=eligible" >> "$GITHUB_OUTPUT"
      - name: Create data-only handoff
        if: steps.eligibility.outputs.outcome == 'eligible'
        env:
          ALLOWED_CHANGE_PATHS: ${{ inputs.allowed-change-paths }}
          PROTECTED_PATHS: ${{ inputs.protected-paths }}
          TITLE: ${{ inputs.proposal-title }}
          BODY: ${{ inputs.proposal-body }}
        run: |
          git diff --cached --binary --full-index HEAD > proposal.patch
          python3 "$RUNNER_TEMP/bot_proposal.py" create --base-commit "$(git rev-parse HEAD)" --patch proposal.patch --allowed-change-paths "$ALLOWED_CHANGE_PATHS" --protected-paths "$PROTECTED_PATHS" --title "$TITLE" --body "$BODY" --output proposal.json
      - uses: actions/upload-artifact@0b7f8abb1508181956e8e162db84b466c27e18ce # v4.3.4
        if: steps.eligibility.outputs.outcome == 'eligible'
        with:
          name: router-infra-bot-proposal
          path: |
            proposal.patch
            proposal.json
          if-no-files-found: error
          retention-days: 1
